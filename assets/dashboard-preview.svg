<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Candidate Screening dashboard preview</title>
  <desc id="desc">Dark placement dashboard with candidate filters, summary metrics, and a student list.</desc>
  <rect width="1400" height="720" fill="#0e1520"/>
