    <text x="318" y="530">3</text><text x="415" y="530">Rohan Nair</text><text x="585" y="530">Computer Science</text><text x="800" y="530">9.10</text><text x="920" y="530">3</text><text x="1030" y="530">2</text><text x="1160" y="530">Strong</text>
